# The defaults this package ships: the limits of the backup store, the limits of the loss and join warnings,
# the layout of a written xlsx sheet, the Google endpoints and the limits of Google Sheets calls.

[backup]
max_entries = 50     # the oldest entries go beyond this count
max_age_days = 14    # entries older than this go
max_total_mb = 2048  # the oldest entries go while the store holds more than this
max_object_mb = 500  # a target bigger than this is replaced without a backup, with a warning

[warnings]
row_drop_share = 0.5  # a replace that keeps fewer than this share of the rows warns
repeated_keys_named = 5  # the most repeated keys of a lookup that the warning of a join names

[xlsx]
column_padding = 2  # characters a written column has beyond its longest value

[google]
token_uri = "https://oauth2.googleapis.com/token"  # where a service-account key gets its access tokens
scopes = ["https://www.googleapis.com/auth/spreadsheets"]  # what the tokens allow

[gsheet]
batch_rows = 10000        # the rows one write call sends
max_cells = 10000000      # the cells a spreadsheet holds at most: a bigger table is refused before any write
retries = 5               # the repeats of a call that Google answers with 429 or 5xx
backoff_seconds = 1.0     # the wait before the first repeat; it doubles for each next one
timeout_seconds = 60.0    # how long one call waits for Google
