schema = 1
mode = "fast"
prefix = "DATAIO"
name = "dataio"
worker = "claude-code"
checks = ["python3 scripts/check_command_docstrings.py", "uv run scripts/release.py --check"]
parallel = 3
timeout_minutes = 90
checks_timeout_minutes = 25
red_timeout_minutes = 30

[limits]
max_lines = 100000
max_files = 10000
max_prompt_tokens = 200000
max_attempts = 4
hook_timeout_seconds = 600

[review]
required_types = ["feature", "bugfix"]  # chore and docs: the short path without review

[publish]
versioning = "semver"
changelog = "CHANGELOG.md"
deploy_command = "sh scripts/deploy.sh"

[connector]
webhook_secret = "PLANE_WEBHOOK_SECRET_TOOLS"
kind = "plane"
base_url = "https://homeserver.tailee01ab.ts.net:8443"
workspace = "tools"
project_id = "555d81d0-8de0-46aa-98d1-871fd2bf6941"
humans = ["r.bolandau@gmail.com"]

[connector.states]
ideas = "Backlog"
queue = "Todo"
in_progress = "In Progress"
in_review = "In Review"
publish = "Publishing"
done = "Done"
cancelled = "Cancelled"

[daemon]
enabled = true
